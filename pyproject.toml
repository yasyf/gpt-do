[tool.poetry]
name = "gpt-do"
version = "0.2.0"
description = "OpenAI-powered shell commands."
authors = ["Yasyf Mohamedali <yasyfm@gmail.com>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/yasyf/gpt-do"

[tool.poetry.dependencies]
python = "==3.*,>=3.9.0"
click = "^8.1.3"
openai = ">=1.66,<3"
dirtyjson = "^1.0.8"
py-getch = "^1.0.1"

[tool.poetry.group.dev.dependencies]
black = ">=25.1,<27"
pytest = ">=8.3,<10"

[tool.poetry.scripts]
do = 'gpt_do.cli:do'
ddo = 'gpt_do.cli:do'
gpt-do = 'gpt_do.cli:do'
derr = 'gpt_do.cli:derr'

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"
